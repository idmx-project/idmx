[package]
name = "idmx-server"
description = "IDMX receiver daemon (idmxd)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "idmxd"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
axum = { version = "0.8.9", default-features = false, features = ["http2", "json", "tokio"] }
axum-server = { version = "0.8.0", default-features = false, features = ["tls-rustls-no-provider"] }
hickory-resolver.workspace = true
idmx-core.workspace = true
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std"] }
serde.workspace = true
serde_json.workspace = true
thiserror = "2.0.20"
time = { version = "0.3.55", features = ["formatting"] }
tokio = { workspace = true, features = ["rt-multi-thread", "net", "fs", "signal"] }
toml = "1.1.6"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[lints]
workspace = true

[dev-dependencies]
ed25519-dalek = "3.0.0"
http-body-util = "0.1.5"
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
