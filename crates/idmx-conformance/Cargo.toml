[package]
name = "idmx-conformance"
description = "IDMX conformance checks for third-party receivers (idmx-conformance)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
idmx-core.workspace = true
ed25519-dalek = { version = "3.0.0", features = ["pkcs8", "pem"] }
tokio.workspace = true
serde_json.workspace = true
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "http2", "json"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std"] }
clap = { version = "4.6.7", features = ["derive"] }
thiserror = "2.0.20"

[lints]
workspace = true

[dev-dependencies]
axum = "0.8.9"
idmx-server = { path = "../idmx-server" }
tempfile = "3.27.0"
