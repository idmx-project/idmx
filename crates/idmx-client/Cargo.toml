[package]
name = "idmx-client"
description = "IDMX sender library and CLI (idmx)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "idmx"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
hickory-resolver.workspace = true
tokio.workspace = true
idmx-core.workspace = true
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "http2", "json"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std"] }
clap = { version = "4.6.7", features = ["derive"] }
getrandom = "0.4.3"
thiserror = "2.0.20"
time = { version = "0.3.55", features = ["formatting"] }
serde.workspace = true
serde_json.workspace = true
ed25519-dalek = { version = "3.0.0", features = ["pkcs8", "pem"] }

[lints]
workspace = true

[dev-dependencies]
axum = "0.8.9"
idmx-server = { path = "../idmx-server" }
tempfile = "3.27.0"
