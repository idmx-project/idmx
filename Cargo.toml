[workspace]
resolver = "3"
members = ["crates/idmx-core", "crates/idmx-server", "crates/idmx-client"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/idmx-project/idmx"
publish = false

[workspace.dependencies]
idmx-core = { path = "crates/idmx-core" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hickory-resolver = "0.26.3"
tokio = { version = "1", features = ["macros", "rt"] }

[workspace.lints.rust]
future-incompatible = { level = "warn", priority = -2 }
nonstandard_style = { level = "deny", priority = -1 }
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -2 }
