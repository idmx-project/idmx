# IDMX devnet. Do not start this directly: ./devnet/up.sh generates keys,
# certificates, and zones, creates the network, and builds the image first.
#
#   dns        CoreDNS, authoritative for the *.test zones      10.89.53.2
#   domain-a   idmxd for domain-a.test on port 443              10.89.53.11
#   domain-b   idmxd for domain-b.test on port 8443 (SVCB port) 10.89.53.12
#   mta-a      Postfix + idmx queue: outbound MTA of domain-a   10.89.53.21
#   legacy     Postfix MX of legacy.test (SMTP only); also the
#              SMTP MX of the modern domains                    10.89.53.30

networks:
  idmx:
    # Created by up.sh with --disable-dns so that containers resolve through
    # CoreDNS only (podman's own DNS forwarder is not in the path).
    external: true
    name: idmx-devnet

x-idmxd: &idmxd
  image: localhost/idmx-devnet:latest
  dns: 10.89.53.2
  depends_on: [dns]
  restart: "no"

services:
  dns:
    image: docker.io/coredns/coredns:1.12.0
    container_name: idmx-dns
    command: ["-conf", "/etc/coredns/Corefile"]
    volumes:
      - ./generated/dns:/etc/coredns:ro
    networks:
      idmx:
        ipv4_address: 10.89.53.2

  domain-a:
    <<: *idmxd
    container_name: idmx-domain-a
    volumes:
      - ./generated/domain-a:/etc/idmx:ro
    networks:
      idmx:
        ipv4_address: 10.89.53.11

  domain-b:
    <<: *idmxd
    container_name: idmx-domain-b
    volumes:
      - ./generated/domain-b:/etc/idmx:ro
    networks:
      idmx:
        ipv4_address: 10.89.53.12

  mta-a:
    <<: *idmxd
    container_name: idmx-mta-a
    hostname: mail.domain-a.test
    entrypoint: ["postfix.sh", "relay", "mail.domain-a.test"]
    command: []
    volumes:
      - ./generated/domain-a:/etc/idmx:ro
    networks:
      idmx:
        ipv4_address: 10.89.53.21

  legacy:
    <<: *idmxd
    container_name: idmx-legacy
    hostname: mx.legacy.test
    entrypoint: ["postfix.sh", "mx", "mx.legacy.test"]
    command: ["bob@legacy.test", "bob@domain-b.test", "alice@domain-a.test"]
    networks:
      idmx:
        ipv4_address: 10.89.53.30
